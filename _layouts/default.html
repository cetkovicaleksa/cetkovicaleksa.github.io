<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <title>
        {%- if page.title and page.title != site.title -%}
        {{ page.title }} | {{ site.title }}
        {%- else -%}
        {{ site.title }}
        {%- endif -%}
    </title>

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="assets/img/roni-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    {% seo %}
</head>

<body>
    <canvas id="matrix"></canvas>

    <main class="page-content">
        {{ content }}
    </main>

    <footer>
        {% assign year = 'now' | date: '%Y' %}
        <p>
            <small>
                &copy; <time datetime="{{ site.since }}">{{ site.since }}</time>{% if year != site.since %} &ndash;
                <time datetime="{{ year }}">{{ year }}</time>{% endif %} {{ site.author.name | title }}. All rights reserved.
                Powered by <a href="https://jekyllrb.com/" translate="no" tabindex="-1">Jekyll</a>.
                Hosted by <a href="https://pages.github.com/" translate="no" tabindex="-1">GitHub
                    pages</a>.
            </small>
        </p>
    </footer>

    <script src="{{ '/assets/js/matrix.js' | relative_url }}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en-GB' }}">

<head>
    <meta charset="utf-8">
    <title>
        {%- if page.title and page.title != site.title -%}
        {{ page.title }} | {{ site.title }}
        {%- else -%}
        {{ site.title }}
        {%- endif -%}
    </title>
    {% seo title=false %}

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="assets/img/roni-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="author" type="text/plain" href="/humans.txt">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
    <canvas id="matrix"></canvas>

    <main class="page-content">
        {{ content }}
    </main>

    {% assign year = 'now' | date: '%Y' %}
    {% assign since = site.since | default: year | append: '' %}

    <footer>
        <p>
            <small>
                &copy; <time datetime="{{ since }}">{{ since }}</time>
                {%- if since != year -%}
                &ndash;<time datetime="{{ year }}">{{ year }}</time>
                {%- endif %}
                {{ site.author.name | escape }}. All rights reserved.
            </small>
        </p>
    </footer>

    <script src="{{ '/assets/js/matrix.js' | relative_url }}"></script>
</body>

</html>
